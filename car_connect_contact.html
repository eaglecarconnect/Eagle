<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: #E8400C; color: white; padding: 20px; text-align: center; }
    .content { padding: 20px; border: 1px solid #ddd; }
    .field { margin-bottom: 12px; }
    .label { font-weight: bold; color: #E8400C; }
    .footer { text-align: center; color: #888; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🦅 New Message from Eagle Car Connect</h2>
    </div>
    <div class="content">
      <div class="field"><span class="label">Name:</span> {{name}}</div>
      <div class="field"><span class="label">Email:</span> {{email}}</div>
      <div class="field"><span class="label">Phone:</span> {{phone}}</div>
      <div class="field"><span class="label">Subject:</span> {{subject}}</div>
      <div class="field"><span class="label">Message:</span></div>
      <p style="background: #f5f5f5; padding: 12px; border-radius: 5px;">{{message}}</p>
    </div>
    <div class="footer">
      This message was sent from Eagle Car Connect contact form.
    </div>
  </div>
</body>
</html>
